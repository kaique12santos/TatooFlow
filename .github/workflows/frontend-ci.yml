name: Frontend CI

on:
  push:
    branches: [ main, develop ]
    paths: ['frontend/**']
  pull_request:
    branches: [ main, develop ]
    paths: ['frontend/**']

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package.json'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Security Audit (Verifica vulnerabilidades em libs)
        run: |
          cd frontend
          npm audit --audit-level=high

      - name: Type check and Linter
        run: |
          cd frontend
          npm run lint || echo "Ajustar linter depois"
          npm run type-check --if-present