spring:
  datasource:
    url: jdbc:h2:file:./data/tattooflow;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  address: 127.0.0.1

integrations:
  whatsapp:
    enabled: false
    mock:
      enabled: false
