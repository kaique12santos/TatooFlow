# ===================================================================
# Configuracoes de Upload Multipart (F4-INFRA-01)
# ===================================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===================================================================
# Cloudinary Configuration (.env)
# ===================================================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ===================================================================
# Google Gemini API Configuration (.env)
# ===================================================================
gemini.api-key=${GEMINI_API_KEY:}
gemini.api-url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent}


# ===================================================================
# Instagram Graph API Configuration (.env)
# ===================================================================
instagram.account-id=${INSTAGRAM_ACCOUNT_ID:}
instagram.access-token=${INSTAGRAM_ACCESS_TOKEN:}
instagram.api-version=${INSTAGRAM_API_VERSION:v21.0}
